<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Online Text Compare Tool – Compare Text Differences Instantly</title>
    <meta name="description" content="Free online text compare tool. Compare two texts and highlight differences instantly. Ideal for documents, code, and content comparison." />
    <meta name="keywords" content="text compare, compare text online, diff tool, text diff" />

    <!-- Open Graph（分享用） -->
    <meta property="og:title" content="Online Text Compare Tool" />
    <meta property="og:description" content="Compare two texts and highlight differences instantly." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://textcompare.top/" />

    <link rel="icon" href="/logo.png" type="image/png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            font-family: Consolas, Monaco, "Courier New", monospace;
            background: #f3f4f6;
            color: #111;
            display: flex;
            flex-direction: column;
        }

        /* 顶部区域（两个输入框） */
        .editor {
            display: flex;
            flex: 1;
            gap: 12px;
            padding: 12px;
        }

        textarea {
            flex: 1;
            resize: none;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 12px;
            font-size: 15px;
            line-height: 1.6;
            outline: none;
        }

        textarea:focus {
            border-color: #2563eb;
        }

        /* 结果区域 */
        .result {
            flex: 1;
            margin: 0 12px 12px;
            padding: 12px;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 15px;
            line-height: 1.7;
        }

        .added {
            background: #dcfce7;
            color: #166534;
        }

        .removed {
            background: #fee2e2;
            color: #991b1b;
            text-decoration: line-through;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .editor {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<!-- 输入区 -->
<div class="editor">
        <textarea
                id="baseText"
                placeholder="Original text"
                oninput="diffUsingJS()"
        ></textarea>

    <textarea
            id="newText"
            placeholder="Modified text"
            oninput="diffUsingJS()"
    ></textarea>
</div>

<!-- 结果区 -->
<div id="outputdiv" class="result"></div>

<!-- diff 逻辑 -->
<script src="/js/lib/diff_match_patch.js"></script>
<script src="/js/textdiff.js"></script>

</body>
</html>
