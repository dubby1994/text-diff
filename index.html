<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv='content-language' content='en'>
    <title>Online Text Diff Tool | Compare Text and Highlight Differences</title>
    <meta name="description" content="Free online text diff tool to compare original and target text. Automatically highlights added, removed, and changed content. Ideal for documents, code, and configuration comparison.">
    <meta name="keywords" content="text diff, text comparison, diff tool, compare text online, text difference checker, document comparison, code diff">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" href="/logo.png" type="image/png">
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <script src="/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<h1>Online Text Diff Tool</h1>
<div class="container-fluid">
    <div class="row">
        <div class="col-4">
            <div class="container mt-2">
                <div class="row align-items-center">
                    <div class="mb-3">
                        <label for="baseText" class="form-label fw-bold">Original</label>
                        <textarea class="form-control" id="baseText"
                                  onchange="diffUsingJS()" style="height: 95vh;"></textarea>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-4">
            <div class="container mt-2">
                <div class="row align-items-center">
                    <div class="mb-3">
                        <label for="outputdiv" class="form-label fw-bold">Changes</label>
                        <div id="outputdiv" style="height: 95vh; overflow: auto; white-space: pre-wrap;"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-4">
            <div class="container mt-2">
                <div class="row align-items-center">
                    <div class="mb-3">
                        <label for="newText" class="form-label fw-bold">Modified</label>
                        <textarea class="form-control" id="newText"
                                  onchange="diffUsingJS()" style="height: 95vh;"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="/js/lib/diff_match_patch.js"></script>
<script src="/js/textdiff.js"></script>

</body>
</html>
