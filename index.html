        .lang-select:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
        .editor{display:flex;gap:16px;margin-bottom:24px}
        .editor-col{flex:1;display:flex;flex-direction:column;gap:8px}
        .editor-col label{font-size:13px;font-weight:600;color:#4b5563}
        .editor-col textarea{width:100%;min-height:220px;padding:14px;font-size:14px;font-family:"SF Mono","Fira Code","Cascadia Code","Noto Sans Mono",Consolas,monospace;border:1px solid #e2e4e8;border-radius:10px;resize:vertical;background:#fff;transition:border-color .2s;color:#1a1a2e;line-height:1.7}

        .editor-col textarea::placeholder{color:#9ca3af}
        .upload-card{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
        .upload-section{flex:1;min-width:200px;background:#fff;padding:16px;border-radius:10px;border:1px solid #e2e4e8;display:flex;flex-direction:column;gap:8px}
        .upload-section label{font-weight:600;margin-bottom:0;color:#4b5563}
        .file-btn{background:#1a1a2e;color:#fff;border:none;padding:8px 16px;font-size:14px;font-weight:600;border-radius:8px;cursor:pointer;transition:all .2s}
        .file-btn:hover{background:#2d2d44}
        .file-name{color:#6b7280;font-size:12px;margin-left:8px}
        .canvas-container{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-bottom:24px}
        canvas{border:1px solid #e2e4e8;border-radius:10px;max-width:100%}
        canvas#canvasDiff{border:1px solid #dc2626}
        .actions{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}

        .btn-primary{background:#1a1a2e;color:#fff}
        .btn-primary:hover{background:#2d2d44;transform:translateY(-1px);box-shadow:0 4px 12px rgba(26,26,46,.2)}
        .btn-secondary{background:#fff;color:#4b5563;border:1px solid #e2e4e8}
        .btn-secondary:hover{background:#f9fafb;border-color:#d1d5db}
        .error{color:#dc2626;font-size:13px;margin-bottom:8px;display:none}

        .result-wrap{background:#fff;border-radius:12px;border:1px solid #e2e4e8;overflow:hidden;margin-bottom:24px}

<div class="page">

    <main>

        <div id="textJsonPanel" class="editor">
            <div class="editor-col">
                <label id="labelLeft">Original</label>
                <textarea id="baseText" placeholder="Paste original text here..." oninput="diffUsingJS()"></textarea>
            </div>
            <div class="editor-col">
                <label id="labelRight">Modified</label>
                <textarea id="newText" placeholder="Paste modified text here..." oninput="diffUsingJS()"></textarea>
            </div>
        </div>

        <div id="excelPanel" style="display:none;">
            <div class="mode-hint" id="excelHint">Select two Excel files and click Compare</div>
            <div class="upload-card">
                <div class="upload-section">
                    <label>Excel File A</label>
                    <input type="file" id="fileA" accept=".xlsx,.xls" style="display:none" />
                    <button class="file-btn" onclick="document.getElementById('fileA').click()">Select File A</button>
                    <span id="fileAName" class="file-name">No file selected</span>
                </div>
                <div class="upload-section">
                    <label>Excel File B</label>
                    <input type="file" id="fileB" accept=".xlsx,.xls" style="display:none" />
                    <button class="file-btn" onclick="document.getElementById('fileB').click()">Select File B</button>
                    <span id="fileBName" class="file-name">No file selected</span>
                </div>
            </div>
        </div>

        <div id="imagePanel" style="display:none;">
            <div class="mode-hint" id="imageHint">Upload two images to compare</div>
            <div class="upload-card">
                <div class="upload-section">
                    <label>Image A</label>
                    <input type="file" id="imgA" accept="image/*" style="display:none" onchange="readImage('imgA','canvasA','imgAName')" />
                    <button class="file-btn" onclick="document.getElementById('imgA').click()">Select Image A</button>
                    <span id="imgAName" class="file-name">No file selected</span>
                </div>
                <div class="upload-section">
                    <label>Image B</label>
                    <input type="file" id="imgB" accept="image/*" style="display:none" onchange="readImage('imgB','canvasB','imgBName')" />
                    <button class="file-btn" onclick="document.getElementById('imgB').click()">Select Image B</button>
                    <span id="imgBName" class="file-name">No file selected</span>
                </div>
            </div>
        </div>

        <div id="errorBox" class="error"></div>

        <div class="actions" id="actionsBar">
            <button class="btn btn-secondary" id="btnFormatLeft">Format Left</button>
            <button class="btn btn-secondary" id="btnFormatRight">Format Right</button>
            <button class="btn btn-primary" id="btnCompare">Compare</button>
            <button class="btn btn-secondary" id="btnExample">Load Example</button>
            <button class="btn btn-secondary" id="btnBlinkStart" style="display:none;">Start Blink</button>
            <button class="btn btn-secondary" id="btnBlinkStop" style="display:none;">Stop Blink</button>
        </div>

        <div class="canvas-container" id="canvasContainer" style="display:none;margin-bottom:24px;">
            <canvas id="canvasA"></canvas>
            <canvas id="canvasB"></canvas>
            <canvas id="canvasDiff"></canvas>
        </div>

        <div class="result-wrap" id="resultWrap">
            <div class="result-bar">
                <span id="resultLabel">Diff Result</span>
                <span id="resultStats"></span>
            </div>
            <div id="outputdiv" class="result"></div>
        </div>

    </main>

<footer id="footerText">
        TextDiff · All comparisons run locally in your browser · No data is sent to any server
    </footer>
</div>

    const dmp=new diff_match_patch();
    let t1=document.getElementById('baseText').value;
    let t2=document.getElementById('newText').value;
    if(currentMode==='json'){
        try{
            t1=JSON.stringify(JSON.parse(t1),null,2);
            t2=JSON.stringify(JSON.parse(t2),null,2);
            document.getElementById('baseText').value=t1;
            document.getElementById('newText').value=t2;
            document.getElementById('errorBox').classList.remove('show');
        }catch(e){
            document.getElementById('errorBox').textContent=i18n[currentLang].error;
            document.getElementById('errorBox').classList.add('show');
            return;
        }
    }
    if(t1===diffCache.base&&t2===diffCache.new)return;
    diffCache.base=t1;diffCache.new=t2;
    const d=dmp.diff_main(t1,t2);
    dmp.diff_cleanupSemantic(d);
    const ds=dmp.diff_prettyHtml(d).replace(/&para;/g,'');
    document.getElementById('outputdiv').innerHTML=ds;
    updateStats(d);
}

function updateStats(d){
    let a=0,r=0;
    for(const op of d){if(op[0]===1)a++;if(op[0]===-1)r++}
    document.getElementById('resultStats').textContent=(a||r)?`${i18n[currentLang].added} ${a} · ${i18n[currentLang].removed} ${r}`:'';
}

function formatJSON(id){
    const ta=document.getElementById(id);
    try{
        ta.value=JSON.stringify(JSON.parse(ta.value),null,2);
        document.getElementById('errorBox').classList.remove('show');
    }catch(e){
        document.getElementById('errorBox').textContent=i18n[currentLang].error;
        document.getElementById('errorBox').classList.add('show');
    }
}

function setLang(lang){
    currentLang=lang;
    const l=i18n[lang];
    document.getElementById('labelLeft').textContent=l.original;
    document.getElementById('labelRight').textContent=l.modified;
    document.getElementById('baseText').placeholder=l.placeholderLeft;
    document.getElementById('newText').placeholder=l.placeholderRight;
    document.getElementById('btnFormatLeft').textContent=l.formatLeft;
    document.getElementById('btnFormatRight').textContent=l.formatRight;
    document.getElementById('btnCompare').textContent=l.compare;
    document.getElementById('btnExample').textContent=l.example;
    document.getElementById('resultLabel').textContent=l.diffResult;
    document.getElementById('resultStats').innerHTML='';
    document.getElementById('errorBox').textContent=l.error;
    document.getElementById('footerText').textContent=l.footer;
    const modeToggle=document.getElementById('modeToggle');
    const modeLabels={text:l.labelText,json:l.labelJson,excel:l.labelExcel,image:l.labelImage};
    modeToggle.querySelectorAll('button').forEach(b=>b.textContent=modeLabels[b.dataset.mode]||b.dataset.mode);
    document.getElementById('excelHint').textContent=l.excelHint;
    document.getElementById('imageHint').textContent=l.imageHint;
    document.querySelector('html').lang=lang==='zh-Hant'?'zh-Hant':lang;
}

function setMode(mode){
    currentMode=mode;
    document.getElementById('modeToggle').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
    const l=i18n[currentLang];
    document.getElementById('textJsonPanel').style.display=(mode==='text'||mode==='json')?'flex':'none';
    document.getElementById('excelPanel').style.display=mode==='excel'?'block':'none';
    document.getElementById('imagePanel').style.display=mode==='image'?'block':'none';
    document.getElementById('canvasContainer').style.display=mode==='image'?'flex':'none';
    const canvasWrap=document.getElementById('resultWrap');
    canvasWrap.innerHTML='<div class="result-bar"><span id="resultLabel">'+l.diffResult+'</span><span id="resultStats"></span></div><div id="outputdiv" class="result"></div>';
    if(mode==='json'){
        document.getElementById('baseText').placeholder=l.placeholderLeft;
        document.getElementById('newText').placeholder=l.placeholderRight;
        document.getElementById('btnFormatLeft').style.display='inline-block';
        document.getElementById('btnFormatRight').style.display='inline-block';
        document.getElementById('btnCompare').onclick=()=>diffUsingJS();
        document.getElementById('btnExample').onclick=loadJSONExample;
    }else if(mode==='text'){
        document.getElementById('baseText').placeholder=l.placeholderLeft;
        document.getElementById('newText').placeholder=l.placeholderRight;
        document.getElementById('btnFormatLeft').style.display='none';
        document.getElementById('btnFormatRight').style.display='none';
        document.getElementById('btnBlinkStart').style.display='none';
        document.getElementById('btnBlinkStop').style.display='none';
        document.getElementById('btnCompare').onclick=diffUsingJS;
        document.getElementById('btnExample').onclick=loadTextExample;
    }else if(mode==='excel'){
        document.getElementById('btnFormatLeft').style.display='none';
        document.getElementById('btnFormatRight').style.display='none';
        document.getElementById('btnBlinkStart').style.display='none';
        document.getElementById('btnBlinkStop').style.display='none';
        document.getElementById('btnCompare').onclick=compareExcel;
        document.getElementById('btnExample').onclick=loadJSONExample;
    }else if(mode==='image'){
        document.getElementById('btnFormatLeft').style.display='none';
        document.getElementById('btnFormatRight').style.display='none';
        document.getElementById('btnBlinkStart').style.display='inline-block';
        document.getElementById('btnBlinkStop').style.display='inline-block';
        document.getElementById('btnCompare').onclick=generatePixelDiff;
    }else{
        document.getElementById('btnBlinkStart').style.display='none';
        document.getElementById('btnBlinkStop').style.display='none';
    }
    document.getElementById('errorBox').classList.remove('show');
    if(mode==='text'||mode==='json'){
        diffCache={base:'',new:''};
        document.getElementById('baseText').value='';
        document.getElementById('newText').value='';
        document.getElementById('outputdiv').innerHTML='';
    }else if(mode==='excel'){
        workbookA=null;workbookB=null;
        document.getElementById('fileAName').textContent='No file selected';
        document.getElementById('fileBName').textContent='No file selected';
        document.getElementById('outputdiv').innerHTML='';
    }else if(mode==='image'){
        imgA=null;imgB=null;
        if(blinkInterval){clearInterval(blinkInterval);blinkInterval=null}
        document.getElementById('imgAName').textContent='No file selected';
        document.getElementById('imgBName').textContent='No file selected';
        ctxA.clearRect(0,0,canvasA.width,canvasA.height);
        ctxB.clearRect(0,0,canvasB.width,canvasB.height);
        ctxDiff.clearRect(0,0,canvasDiff.width,canvasDiff.height);
        document.getElementById('outputdiv').innerHTML='';
    }
    document.getElementById('resultStats').innerHTML='';
}

document.getElementById('fileA').addEventListener('change',function(){
    if(this.files.length>0){
        document.getElementById('fileAName').textContent=this.files[0].name;
        const reader=new FileReader();
        reader.onload=function(e){
            const data=new Uint8Array(e.target.result);
            workbookA=XLSX.read(data,{type:'array'});
        };
        reader.readAsArrayBuffer(this.files[0]);
    }
});
document.getElementById('fileB').addEventListener('change',function(){
    if(this.files.length>0){
        document.getElementById('fileBName').textContent=this.files[0].name;
        const reader=new FileReader();
        reader.onload=function(e){
            const data=new Uint8Array(e.target.result);
            workbookB=XLSX.read(data,{type:'array'});
        };
        reader.readAsArrayBuffer(this.files[0]);
    }
});

function compareExcel(){
    const l=i18n[currentLang];
    if(!workbookA||!workbookB){
        alert(l.selectBoth);return;
    }
    const resultDiv=document.getElementById('outputdiv');
    resultDiv.innerHTML='';
    const sheetNames=workbookA.SheetNames.filter(name=>workbookB.SheetNames.includes(name));
    if(sheetNames.length===0){
        resultDiv.innerHTML='<p style="color:#6b7280;padding:16px;">No matching sheets found.</p>';
        return;
    }
    const container=document.createElement('div');
    container.className='diff-table-container';
    sheetNames.forEach(sheetName=>{
        const table=document.createElement('table');
        const caption=document.createElement('caption');
        caption.textContent=l.diffResult+': '+sheetName;
        table.appendChild(caption);
        const sheetA=XLSX.utils.sheet_to_json(workbookA.Sheets[sheetName],{header:1});
        const sheetB=XLSX.utils.sheet_to_json(workbookB.Sheets[sheetName],{header:1});
        const maxRows=Math.max(sheetA.length,sheetB.length);
        const maxCols=Math.max(...sheetA.map(r=>r.length),...sheetB.map(r=>r.length));
        for(let i=0;i<maxRows;i++){
            const tr=document.createElement('tr');
            for(let j=0;j<maxCols;j++){
                const td=document.createElement('td');
                const valA=sheetA[i]&&sheetA[i][j]!==undefined?sheetA[i][j]:'';
                const valB=sheetB[i]&&sheetB[i][j]!==undefined?sheetB[i][j]:'';
                td.textContent=valB;
                if(valA!=valB)td.classList.add('diff-cell');
                tr.appendChild(td);
            }
            table.appendChild(tr);
        }
        container.appendChild(table);
    });
    resultDiv.appendChild(container);
}

function readImage(inputId,canvasId,nameSpanId){
    const fileInput=document.getElementById(inputId);
    const nameSpan=document.getElementById(nameSpanId);
    if(fileInput.files.length===0)return;
    const file=fileInput.files[0];
    nameSpan.textContent=file.name;
    const reader=new FileReader();
    reader.onload=function(e){
        const img=new Image();
        img.onload=function(){
            const canvas=document.getElementById(canvasId);
            const ctx=canvas.getContext('2d');
            canvas.width=img.width;
            canvas.height=img.height;
            ctx.drawImage(img,0,0);
            if(inputId==='imgA')imgA=img;
            if(inputId==='imgB')imgB=img;
        };
        img.src=e.target.result;
    };
    reader.readAsDataURL(file);
}

function generatePixelDiff(){
    const l=i18n[currentLang];
    if(!imgA||!imgB){
        alert(l.selectBoth);return;
    }
    const width=Math.min(imgA.width,imgB.width);
    const height=Math.min(imgA.height,imgB.height);
    canvasDiff.width=width;canvasDiff.height=height;
    ctxDiff.clearRect(0,0,width,height);
    ctxA.clearRect(0,0,canvasA.width,canvasA.height);
    ctxA.drawImage(imgA,0,0,width,height);
    ctxB.clearRect(0,0,canvasB.width,canvasB.height);
    ctxB.drawImage(imgB,0,0,width,height);
    const dataA=ctxA.getImageData(0,0,width,height);
    const dataB=ctxB.getImageData(0,0,width,height);
    const diffData=ctxDiff.createImageData(width,height);
    for(let i=0;i<dataA.data.length;i+=4){
        const rDiff=Math.abs(dataA.data[i]-dataB.data[i]);
        const gDiff=Math.abs(dataA.data[i+1]-dataB.data[i+1]);
        const bDiff=Math.abs(dataA.data[i+2]-dataB.data[i+2]);
        const diff=rDiff+gDiff+bDiff;
        if(diff>30){
            diffData.data[i]=255;diffData.data[i+1]=0;diffData.data[i+2]=0;diffData.data[i+3]=200;
        }else{
            diffData.data[i+3]=0;
        }
    }
    ctxDiff.putImageData(diffData,0,0);
}

function startBlink(){
    const l=i18n[currentLang];
    if(!imgA||!imgB){
        alert(l.selectBoth);return;
    }
    stopBlink();
    const width=Math.min(imgA.width,imgB.width);
    const height=Math.min(imgA.height,imgB.height);
    canvasDiff.width=width;canvasDiff.height=height;
    let showA=true;
    blinkInterval=setInterval(()=>{
        ctxDiff.clearRect(0,0,width,height);
        if(showA)ctxDiff.drawImage(imgA,0,0,width,height);
        else ctxDiff.drawImage(imgB,0,0,width,height);
        showA=!showA;
    },500);
}

function stopBlink(){if(blinkInterval){clearInterval(blinkInterval);blinkInterval=null}}

function loadJSONExample(){
    const jsonA=`{"name":"Alice","age":25,"city":"New York","skills":["JavaScript","Python"]}`;
    const jsonB=`{"name":"Alice","age":26,"city":"New York","skills":["JavaScript","Python","Go"]}`;
    document.getElementById('baseText').value=jsonA;
    document.getElementById('newText').value=jsonB;
    diffUsingJS();
}

    const txtA=`Hello World!
This is the original text.
It contains several lines.
We will compare this version.`;
    const txtB=`Hello World!
This is the modified text.
It contains several lines.
We will compare this version with some changes.`;
    document.getElementById('baseText').value=txtA;
    document.getElementById('newText').value=txtB;
    diffUsingJS();
}

document.getElementById('langSelect').addEventListener('change',e=>{
    localStorage.setItem('textdiff-lang',e.target.value);
    setLang(e.target.value);
});
document.getElementById('modeToggle').addEventListener('click',e=>{
    if(e.target.tagName==='BUTTON'){
        localStorage.setItem('textdiff-mode',e.target.dataset.mode);
        setMode(e.target.dataset.mode);
    }
});
document.getElementById('btnCompare').addEventListener('click',()=>{
    if(currentMode==='excel')compareExcel();
    else if(currentMode==='image')generatePixelDiff();
    else diffUsingJS();
});
document.getElementById('btnBlinkStart').addEventListener('click',startBlink);
document.getElementById('btnBlinkStop').addEventListener('click',stopBlink);

(function(){
    const savedLang=localStorage.getItem('textdiff-lang');
    const savedMode=localStorage.getItem('textdiff-mode');
    if(savedLang)currentLang=savedLang;
    if(savedMode)currentMode=savedMode;
    document.getElementById('langSelect').value=currentLang;
    setMode(currentMode);
    setLang(currentLang);
})();
</script>
