<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'DM Sans', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f8fa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- brand mark -->
  <g transform="translate(80,72)">
    <rect width="44" height="44" rx="10" fill="#0a0b0d"/>
    <rect x="10" y="11" width="9" height="22" rx="2" fill="#4f7cf5"/>
    <rect x="25" y="11" width="9" height="22" rx="2" fill="none" stroke="#4f7cf5" stroke-width="2"/>
    <text x="58" y="24" fill="#0c0e14" font-size="22" font-weight="600">Text Diff</text>
    <text x="58" y="40" fill="#8a93a6" font-size="11" letter-spacing="2.5">TEXT DIFF</text>
  </g>

  <!-- title -->
  <text x="80" y="300" fill="#0c0e14" font-size="72" font-weight="600" letter-spacing="-2">Every change,</text>
  <text x="80" y="382" fill="#2f6bff" font-size="72" font-weight="500" letter-spacing="-2">in plain sight.</text>

  <!-- subtitle -->
  <text x="82" y="448" fill="#4b5364" font-size="24">Inline, side-by-side &amp; unified diff — runs entirely in your browser.</text>

  <!-- diff illustration -->
  <g transform="translate(80,498)" font-family="'JetBrains Mono', monospace" font-size="19">
    <rect x="0" y="0" width="1040" height="84" rx="12" fill="#ffffff" stroke="#eceef3"/>
    <text x="24" y="34" fill="#4b5364">the quick brown fox </text>
    <rect x="222" y="16" width="78" height="24" rx="5" fill="#fef0f2"/>
    <text x="230" y="34" fill="#d23442" text-decoration="line-through">jumps</text>
    <text x="304" y="34" fill="#4b5364"> </text>
    <rect x="316" y="16" width="74" height="24" rx="5" fill="#ecfdf3"/>
    <text x="324" y="34" fill="#07935a">leaps</text>
    <text x="394" y="34" fill="#4b5364"> over the lazy dog.</text>
    <rect x="24" y="48" width="286" height="24" rx="5" fill="#ecfdf3"/>
    <text x="32" y="66" fill="#07935a">+ The five boxing wizards jump.</text>
  </g>
</svg>
